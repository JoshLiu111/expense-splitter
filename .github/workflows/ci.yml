name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_splitter
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # S2 runs against a Neon test branch when the E2E_DATABASE_URL secret is
      # set, otherwise against the Postgres service above. Playwright's global
      # setup migrates it.
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || 'postgres://postgres:postgres@localhost:5432/expense_splitter' }}
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/expense_splitter_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Create test database
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c 'create database expense_splitter_test'
      - name: Unit and repository tests (S1)
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: End-to-end tests (S2)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
